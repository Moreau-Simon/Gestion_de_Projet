services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb_saas
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - saas_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend_saas
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017}
      - MONGO_DB_NAME=${MONGO_DB_NAME:-saas_pm_db}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev_secret_key_change_in_production_9f8d7e6c5b4a321}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - saas_network

volumes:
  mongo_data:
    name: saas_mongo_data

networks:
  saas_network:
    name: saas_network
