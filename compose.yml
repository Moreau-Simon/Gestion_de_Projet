name: flowsaas

x-mongo-healthcheck: &mongo-healthcheck
  test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping: 1}).ok"]
  interval: 5s
  timeout: 5s
  retries: 20
  start_period: 10s

services:
  cfg1:
    image: mongo:7.0
    command: ["mongod", "--configsvr", "--replSet", "cfgRS", "--port", "27017", "--bind_ip_all"]
    volumes: ["cfg1_data:/data/configdb"]
    healthcheck: *mongo-healthcheck
    networks: [mongo_net]
    restart: unless-stopped
  cfg2:
    image: mongo:7.0
    command: ["mongod", "--configsvr", "--replSet", "cfgRS", "--port", "27017", "--bind_ip_all"]
    volumes: ["cfg2_data:/data/configdb"]
    healthcheck: *mongo-healthcheck
    networks: [mongo_net]
    restart: unless-stopped
  cfg3:
    image: mongo:7.0
    command: ["mongod", "--configsvr", "--replSet", "cfgRS", "--port", "27017", "--bind_ip_all"]
    volumes: ["cfg3_data:/data/configdb"]
    healthcheck: *mongo-healthcheck
    networks: [mongo_net]
    restart: unless-stopped

  shard1a:
    image: mongo:7.0
    command: ["mongod", "--shardsvr", "--replSet", "shard1RS", "--port", "27017", "--bind_ip_all"]
    volumes: ["shard1a_data:/data/db"]
    healthcheck: *mongo-healthcheck
    networks: [mongo_net]
    restart: unless-stopped
  shard1b:
    image: mongo:7.0
    command: ["mongod", "--shardsvr", "--replSet", "shard1RS", "--port", "27017", "--bind_ip_all"]
    volumes: ["shard1b_data:/data/db"]
    healthcheck: *mongo-healthcheck
    networks: [mongo_net]
    restart: unless-stopped
  shard1c:
    image: mongo:7.0
    command: ["mongod", "--shardsvr", "--replSet", "shard1RS", "--port", "27017", "--bind_ip_all"]
    volumes: ["shard1c_data:/data/db"]
    healthcheck: *mongo-healthcheck
    networks: [mongo_net]
    restart: unless-stopped

  shard2a:
    image: mongo:7.0
    command: ["mongod", "--shardsvr", "--replSet", "shard2RS", "--port", "27017", "--bind_ip_all"]
    volumes: ["shard2a_data:/data/db"]
    healthcheck: *mongo-healthcheck
    networks: [mongo_net]
    restart: unless-stopped
  shard2b:
    image: mongo:7.0
    command: ["mongod", "--shardsvr", "--replSet", "shard2RS", "--port", "27017", "--bind_ip_all"]
    volumes: ["shard2b_data:/data/db"]
    healthcheck: *mongo-healthcheck
    networks: [mongo_net]
    restart: unless-stopped
  shard2c:
    image: mongo:7.0
    command: ["mongod", "--shardsvr", "--replSet", "shard2RS", "--port", "27017", "--bind_ip_all"]
    volumes: ["shard2c_data:/data/db"]
    healthcheck: *mongo-healthcheck
    networks: [mongo_net]
    restart: unless-stopped

  replica-set-init:
    image: mongo:7.0
    entrypoint: ["bash", "/scripts/init-replica-sets.sh"]
    volumes: ["./scripts:/scripts:ro"]
    depends_on:
      cfg1: { condition: service_healthy }
      cfg2: { condition: service_healthy }
      cfg3: { condition: service_healthy }
      shard1a: { condition: service_healthy }
      shard1b: { condition: service_healthy }
      shard1c: { condition: service_healthy }
      shard2a: { condition: service_healthy }
      shard2b: { condition: service_healthy }
      shard2c: { condition: service_healthy }
    networks: [mongo_net]
    restart: "no"

  mongos:
    image: mongo:7.0
    command:
      - mongos
      - --configdb
      - cfgRS/cfg1:27017,cfg2:27017,cfg3:27017
      - --bind_ip_all
      - --port
      - "27017"
    ports: ["27017:27017"]
    depends_on:
      replica-set-init: { condition: service_completed_successfully }
    healthcheck: *mongo-healthcheck
    networks: [mongo_net]
    restart: unless-stopped

  cluster-init:
    image: mongo:7.0
    entrypoint: ["mongosh", "mongodb://mongos:27017/admin", "--quiet", "/scripts/init-cluster.js"]
    volumes: ["./scripts:/scripts:ro"]
    depends_on:
      mongos: { condition: service_healthy }
    networks: [mongo_net]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports: ["8000:8000"]
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongos:27017}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-saas_pm_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev_secret_key_change_in_production_9f8d7e6c5b4a321}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
    depends_on:
      cluster-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [mongo_net]
    restart: unless-stopped

volumes:
  cfg1_data:
  cfg2_data:
  cfg3_data:
  shard1a_data:
  shard1b_data:
  shard1c_data:
  shard2a_data:
  shard2b_data:
  shard2c_data:

networks:
  mongo_net:
    name: flowsaas_mongo_net
